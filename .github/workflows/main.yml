
name: A02 AddSub8bit CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile RTL and testbench
        run: |
          iverilog -g2012 -Wall \
            -o A02_AddSub8bit/sim/ci_sim.vvp \
            A02_AddSub8bit/rtl/a02_addsub_flags.sv \
            A02_AddSub8bit/testbench/a02_tb.sv

      - name: Run simulation
        run: |
          vvp A02_AddSub8bit/sim/ci_sim.vvp

